<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom · 30 · 30 · 30</title>
<meta name="description" content="Phantom. 30 reels, 30 posts, 30 days. On autopilot.">
<link rel="icon" href="assets/phantom-logo.svg">
<link rel="stylesheet" href="assets/phantom.css">
<script src="assets/phantom.js"></script>
<script src="assets/track.js"></script>

<style>
  /* ============ Phantom landing (v1 design, 2.0 funnel) ============ */
  :root { --hero-pad: clamp(72px, 8vh, 120px); }
  html, body { height:100%; }
  body { background: var(--bg); overflow-x:hidden; color:var(--text); }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 620px at 50% -8%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(720px 520px at 90% 110%, rgba(54,226,196,.07), transparent 65%),
      radial-gradient(560px 360px at 8% 92%, rgba(124,92,255,.08), transparent 65%);
  }
  body::after {
    /* subtle horizon line — gives the cylinder a "floor" */
    content:""; position:fixed; left:0; right:0; bottom:0; height:1px; z-index:1;
    background: linear-gradient(90deg, transparent, rgba(124,92,255,.35), transparent);
    pointer-events:none;
  }

  /* nav */
  .gnav { position:fixed; top:0; left:0; right:0; z-index:10; height:64px;
    background: linear-gradient(180deg, rgba(10,11,16,.55), rgba(10,11,16,0));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .gnav .row { max-width:1280px; margin:0 auto; height:100%;
    display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
  .gnav .glyph { display:inline-flex; align-items:center; }
  .gnav .glyph img { width:30px; height:30px; filter:drop-shadow(0 4px 14px var(--accent-glow)); }
  .gnav .signin { font-size:.92rem; color:var(--text-3); }
  .gnav .signin a { color:var(--accent-2); font-weight:500; }
  .gnav .signin a:hover { color:var(--text); }

  /* hero */
  .hero {
    position:relative; z-index:1;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding: var(--hero-pad) 24px;
    text-align:center;
  }

  /* ============ 3D cylinder backdrop (chess pattern, 2 rows) ============ */
  .cylinder {
    position:absolute; inset:0; z-index:0;
    perspective: 1600px; perspective-origin: 50% 50%;
    overflow:hidden; pointer-events:none;
  }
  .cylinder-rows {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    gap: clamp(14px, 2.4vh, 28px);
    justify-content:center;
    transform-style: preserve-3d;
  }
  .cylinder-track {
    display:flex; gap:22px; width:max-content;
    flex:0 0 auto;
    transform-style: preserve-3d;
    will-change: transform;
  }
  /* Two rows scroll at slightly different speeds in opposite directions.
     row-bot has a half-tile margin so its reels sit in the gaps of row-top
     (the chess pattern). */
  .cylinder-track.row-top { animation: cyl-scroll 260s linear infinite; }
  .cylinder-track.row-bot {
    animation: cyl-scroll 320s linear infinite reverse;
    margin-left: clamp(95px, 11vw, 150px);
  }
  @keyframes cyl-scroll {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }
  .reel {
    flex:0 0 clamp(140px, 17vw, 220px);
    aspect-ratio:9/16;
    border-radius:22px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--hairline);
    transform-style: preserve-3d; backface-visibility:hidden;
    will-change: transform;
    box-shadow: 0 26px 60px -28px rgba(0,0,0,.6);
  }
  .reel video, .reel img { width:100%; height:100%; object-fit:cover; display:block; }
  .cylinder::after {
    /* Tight vertical vignette only — fades fully at top + bottom so the row
       edges blend out, but leaves the horizontal sides intact so reels never
       disappear at the left/right of the viewport. */
    content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(180deg,
      rgba(10,11,16,1)  0%,
      rgba(10,11,16,.7) 10%,
      transparent       18%,
      transparent       82%,
      rgba(10,11,16,.7) 90%,
      rgba(10,11,16,1)  100%);
  }
  @media (prefers-reduced-motion: reduce) { .cylinder-track { animation:none; } }

  /* ============ liquid-glass card wrapping the hero stack ============ */
  .glass {
    position:relative; z-index:2;
    max-width: min(880px, 92vw);
    width:100%;
    padding: clamp(36px, 5.2vh, 64px) clamp(28px, 4.5vw, 64px);
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(16,18,28,.58), rgba(10,11,16,.62));
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow:
      0 40px 90px -28px rgba(0,0,0,.72),
      0 18px 40px -20px rgba(124,92,255,.28),
      inset 0 1px 0 rgba(255,255,255,.08);
    transform: translateY(-6vh);
    isolation: isolate;
  }
  .glass::before {
    /* subtle inset highlight on the top edge */
    content:""; position:absolute; inset:0;
    border-radius: inherit; pointer-events:none;
    background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 28%);
    z-index:-1;
  }

  /* ============ hero content ============ */
  .stack {
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    gap: clamp(12px, 1.8vh, 22px);
    width:100%;
  }
  .stack > * { opacity:0; transform:translateY(14px); animation: rise .9s var(--ease) forwards; }
  .stack > *:nth-child(1) { animation-delay:.05s; }
  .stack > *:nth-child(2) { animation-delay:.18s; }
  .stack > *:nth-child(3) { animation-delay:.30s; }
  .stack > *:nth-child(4) { animation-delay:.46s; }
  .stack > *:nth-child(5) { animation-delay:.66s; }
  @keyframes rise { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .stack > * { opacity:1; transform:none; animation:none; }
  }

  /* ghost mark */
  .mark {
    width: clamp(84px, 9vw, 116px);
    aspect-ratio:1/1.1; position:relative;
  }
  .mark .aura {
    position:absolute; inset:-30%;
    background: radial-gradient(closest-side, rgba(124,92,255,.55), transparent 70%);
    filter: blur(10px); z-index:-1;
    animation: aura-pulse 5s var(--ease) infinite;
  }
  @keyframes aura-pulse {
    0%,100% { opacity:.55; transform:scale(1); }
    50%     { opacity:1;   transform:scale(1.12); }
  }
  .mark svg { width:100%; height:100%; display:block; overflow:visible; }
  .ghost-body { transform-origin: 50% 65%; animation: ghost-float 7s var(--ease) infinite; }
  @keyframes ghost-float {
    0%,100% { transform: translateY(0) scale(1); }
    50%     { transform: translateY(-7px) scale(1.018); }
  }
  .ghost-hem path { animation: hem-wobble 6s var(--ease) infinite; }
  @keyframes hem-wobble {
    0%,100% { d: path("M12 102Q18 95 24 102T36 102T48 102T60 102T72 102T84 102T96 102"); }
    50%     { d: path("M12 102Q18 106 24 102T36 102T48 102T60 102T72 102T84 102T96 102"); }
  }
  .ghost-eye { transform-box: fill-box; transform-origin:center;
    transition: transform .12s var(--ease); }
  .ghost-eye.blink { animation: blink 6s steps(1,end) infinite; }
  @keyframes blink {
    0%,93%,100% { transform: scaleY(1); }
    95%,98%     { transform: scaleY(.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ghost-body, .ghost-hem path, .ghost-eye, .mark .aura { animation:none; }
  }

  /* eyebrow */
  .eyebrow {
    font-size:.78rem; letter-spacing:.32em; text-transform:uppercase;
    color: var(--text-3); font-weight:500;
  }
  .eyebrow .pulse {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--teal); box-shadow:0 0 12px var(--teal);
    vertical-align:middle; margin-right:9px; opacity:.85;
    animation: dot-pulse 2.4s var(--ease) infinite;
  }
  @keyframes dot-pulse { 0%,100% { transform:scale(1); opacity:.6; } 50% { transform:scale(1.4); opacity:1; } }

  /* PHANTOM wordmark */
  .wordmark {
    margin:0;
    font-family: var(--display); font-weight:700;
    font-size: clamp(2.6rem, 7.6vw, 5.4rem);
    line-height:.95; letter-spacing:.06em;
    background: linear-gradient(180deg, #ffffff 0%, #d6c9ff 55%, var(--accent-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 20px rgba(10,11,16,.85)) drop-shadow(0 2px 6px rgba(10,11,16,.7));
  }

  /* 30 · 30 · 30 tricolon */
  .tri {
    display:flex; align-items:stretch; justify-content:center;
    gap: clamp(20px, 4.5vw, 64px);
    margin-top: clamp(4px, 1vh, 12px);
  }
  .tri-col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .tri-num {
    font-family: var(--display); font-weight:700;
    font-size: clamp(3rem, 9.5vw, 7.2rem);
    line-height:.95; letter-spacing:-.02em;
    background: linear-gradient(180deg, #ffffff 0%, var(--accent-2) 70%, var(--accent) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 18px rgba(10,11,16,.85)) drop-shadow(0 2px 6px rgba(10,11,16,.7));
  }
  .tri-label {
    font-size:.74rem; letter-spacing:.28em; text-transform:uppercase;
    color: var(--text-3); font-weight:500;
  }
  .tri-rule {
    width:1px; align-self:stretch;
    background: linear-gradient(180deg, transparent 0%, rgba(157,134,255,.55) 40%, rgba(157,134,255,.55) 60%, transparent 100%);
    margin-top: 4px;
  }

  /* CTA */
  .cta {
    display:inline-flex; align-items:center; gap:10px;
    height:60px; padding:0 42px;
    border-radius:999px; border:0;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: var(--on-accent); font-weight:600; font-size:1.06rem;
    box-shadow: 0 0 0 1px rgba(124,92,255,.4), 0 26px 60px -16px var(--accent-glow);
    cursor:pointer; transition: transform .15s var(--ease), box-shadow .2s var(--ease);
    position:relative; isolation:isolate;
  }
  .cta::before {
    content:""; position:absolute; inset:-3px;
    border-radius:999px; z-index:-1;
    background: conic-gradient(from 0deg, rgba(124,92,255,.0), rgba(157,134,255,.6), rgba(54,226,196,.4), rgba(124,92,255,.0));
    filter: blur(10px); opacity:.7;
    animation: halo 8s linear infinite;
  }
  @keyframes halo { to { transform: rotate(360deg); } }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: translateY(0); }
  .cta svg { width:18px; height:18px; }

  /* responsive */
  @media (max-width: 780px) {
    .tri { gap: clamp(14px, 3.5vw, 28px); }
    .tri-rule { display:none; }
    .reel { flex-basis: 118px; border-radius:16px; }
    .cylinder-track.row-top { animation-duration:200s; }
    .cylinder-track.row-bot { animation-duration:250s; }
    .cylinder-rows { gap: 12px; }
    .cta { height:54px; padding:0 30px; }
  }
</style>
</head>
<body>

<header class="gnav">
  <div class="row">
    <a class="glyph" href="index.html" aria-label="Phantom"><img src="assets/phantom-logo.svg" alt=""></a>
    <p class="signin">Already have an account? <a href="signup.html">Sign in</a></p>
  </div>
</header>

<main class="hero">
  <!-- Cylindrical reels backdrop — two-row chess pattern -->
  <div class="cylinder" aria-hidden="true">
    <div class="cylinder-rows">
      <div class="cylinder-track row-top" id="reelsTrackTop"></div>
      <div class="cylinder-track row-bot" id="reelsTrackBot"></div>
    </div>
  </div>

  <!-- Hero content -->
  <div class="glass">
    <div class="stack">
    <div class="mark">
      <div class="aura"></div>
      <svg viewBox="0 0 100 110" fill="none" role="img" aria-label="Phantom">
        <defs>
          <linearGradient id="phantomGhostFill" x1="50" y1="5" x2="50" y2="105" gradientUnits="userSpaceOnUse">
            <stop stop-color="#BEA6FA"/>
            <stop offset="0.55" stop-color="#8E63F0"/>
            <stop offset="1" stop-color="#6E42CB"/>
          </linearGradient>
        </defs>
        <g class="ghost-body">
          <path d="M12 105V42C12 17 31 5 50 5C69 5 88 17 88 42V105Q81 96 74 105Q67 96 60 105Q53 96 46 105Q39 96 32 105Q25 96 18 105Q15 100 12 105Z" fill="url(#phantomGhostFill)"/>
          <g class="ghost-hem"><path d="M12 102Q18 95 24 102T36 102T48 102T60 102T72 102T84 102T96 102" stroke="rgba(255,255,255,.14)" stroke-width="1" fill="none"/></g>
          <rect id="eyeL" class="ghost-eye blink" x="33.5" y="40" width="8" height="24" rx="4" fill="#2C2545"/>
          <rect id="eyeR" class="ghost-eye blink" x="58.5" y="40" width="8" height="24" rx="4" fill="#2C2545"/>
        </g>
      </svg>
    </div>

    <span class="eyebrow"><span class="pulse"></span>autonomous content</span>

    <h1 class="wordmark">PHANTOM</h1>

    <div class="tri" role="group" aria-label="30 reels, 30 posts, 30 days">
      <div class="tri-col"><div class="tri-num">30</div><div class="tri-label">Reels</div></div>
      <div class="tri-rule" aria-hidden="true"></div>
      <div class="tri-col"><div class="tri-num">30</div><div class="tri-label">Posts</div></div>
      <div class="tri-rule" aria-hidden="true"></div>
      <div class="tri-col"><div class="tri-num">30</div><div class="tri-label">Days</div></div>
    </div>

    <a class="cta" href="intake.html" onclick="track('landing.cta_clicked')">Get started <i data-icon="arrow-right"></i></a>
    </div>
  </div>
</main>

<script>
Phantom.ready(function () {
  var P = window.Phantom;

  // ===== Reels: build two chess-pattern rows, autoplay =====
  // Compact muted loops transcoded from the v1 render library (assets/landing/).
  var rowTopReels = ['02','07','15','24','28','05','20','10'];
  var rowBotReels = ['03','11','17','22','30','18','25','13'];
  function buildRow(ids) {
    return ids.map(function (n) {
      return '<div class="reel"><video src="assets/landing/reel_' + n + '.mp4#t=0.6" muted playsinline preload="metadata" loop autoplay></video></div>';
    }).join('');
  }
  P.$('#reelsTrackTop').innerHTML = buildRow(rowTopReels).repeat(2);
  P.$('#reelsTrackBot').innerHTML = buildRow(rowBotReels).repeat(2);
  P.$$('.cylinder-track video').forEach(function (v) { v.play().catch(function(){}); });
  P.mountIcons();

  // ===== 3D cylinder transform per reel (applies to both rows) =====
  var reels = P.$$('.cylinder-track .reel');
  function tick() {
    var vw = window.innerWidth;
    var cx = vw / 2;
    var half = vw * 0.6; // distance over which scale reaches max
    for (var i = 0; i < reels.length; i++) {
      var r = reels[i].getBoundingClientRect();
      if (r.right < -300 || r.left > vw + 300) continue;
      var d = ((r.left + r.width / 2) - cx) / half; // signed -1..+1
      var ad = Math.min(1, Math.abs(d));
      var k = 0.5 - 0.5 * Math.cos(ad * Math.PI);  // 0 at center → 1 at edges
      var s = 0.55 + (1 - 0.55) * k;
      var tz = -180 * (1 - k);                      // push center back
      var ry = -d * 28 * (1 - k * 0.55);            // tilt inward
      reels[i].style.transform =
        'translateZ(' + tz.toFixed(1) + 'px) rotateY(' + ry.toFixed(1) + 'deg) scale(' + s.toFixed(3) + ')';
      reels[i].style.opacity = (0.92 + 0.08 * k).toFixed(3);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ===== Ghost eyes track cursor =====
  var eyeL = document.getElementById('eyeL');
  var eyeR = document.getElementById('eyeR');
  var mark = P.$('.mark');
  function lookAt(e) {
    if (!mark) return;
    var rect = mark.getBoundingClientRect();
    var mx = rect.left + rect.width / 2;
    var my = rect.top + rect.height / 2;
    var dx = (e.clientX - mx) / window.innerWidth;
    var dy = (e.clientY - my) / window.innerHeight;
    var tx = Math.max(-2.4, Math.min(2.4, dx * 6));
    var ty = Math.max(-2.4, Math.min(2.4, dy * 6));
    if (eyeL) eyeL.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    if (eyeR) eyeR.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
  }
  window.addEventListener('mousemove', lookAt, { passive:true });
});
</script>

</body>
</html>
