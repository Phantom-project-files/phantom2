<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout · Phantom</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/phantom-logo.svg">
<link rel="stylesheet" href="assets/phantom.css">
<script src="assets/phantom.js"></script>
<script src="assets/track.js"></script>

<style>
  body { background:var(--bg); overflow-x:hidden; }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 620px at 50% -8%, rgba(124,92,255,.20), transparent 60%),
      radial-gradient(720px 520px at 90% 110%, rgba(54,226,196,.07), transparent 65%),
      radial-gradient(560px 360px at 8% 92%, rgba(124,92,255,.08), transparent 65%);
  }

  /* ---- min nav (shared pattern, ported from intake.html) ---- */
  .min-nav { position:sticky; top:0; z-index:10; height:72px;
    background:rgba(10,11,16,.55); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .min-nav .inner { max-width:1080px; margin-inline:auto; padding:0 24px;
    height:100%; display:flex; align-items:center; gap:14px; }
  .min-brand { display:inline-flex; align-items:center; gap:10px;
    font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-.02em; color:var(--text); }
  .min-brand img { width:26px; height:26px; filter:drop-shadow(0 4px 12px var(--accent-glow)); }
  .min-spacer { flex:1; }

  .stage { position:relative; z-index:1; min-height:calc(100dvh - 72px); display:grid; place-items:center; padding:24px; }

  .checkout-card {
    position:relative; width:100%; max-width:452px;
    padding: clamp(32px, 5vw, 44px) clamp(26px, 4.5vw, 40px);
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(10,11,16,.55));
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 40px 90px -32px rgba(0,0,0,.72), 0 16px 40px -20px rgba(124,92,255,.22), inset 0 1px 0 rgba(255,255,255,.07);
    text-align:center;
  }
  .checkout-card .mark-img { width:44px; height:44px; margin:0 auto 16px; filter:drop-shadow(0 6px 18px var(--accent-glow)); }
  .checkout-card h1 { font-family:var(--display); font-weight:600; letter-spacing:-.02em; color:#fff;
    font-size:1.4rem; margin:0 0 8px; }
  .checkout-card .sub { color:var(--text-2); font-size:.96rem; margin:0; line-height:1.5; }

  .spinner { width:38px; height:38px; margin:0 auto 20px; border-radius:50%;
    background:conic-gradient(from 0deg, transparent, var(--accent-2), transparent 70%);
    animation:spin 1.2s linear infinite; position:relative; }
  .spinner::before { content:""; position:absolute; inset:5px; border-radius:50%; background:var(--bg); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }

  .op-divider { display:flex; align-items:center; gap:10px; margin: 22px 0 16px;
    color:var(--text-3); font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; font-family:var(--mono); }
  .op-divider span.rule { flex:1; height:1px; background:var(--hairline-2); }

  #operatorCard { text-align:left; }
  #operatorCard .note { font-size:.78rem; color:var(--text-3); margin-top:12px; line-height:1.5; }
  #opMsg { font-size:.82rem; min-height:1.2em; margin-top:10px; color:var(--text-3); }
</style>
</head>
<body>

<header class="min-nav">
  <div class="inner">
    <a class="min-brand" href="index.html"><img src="assets/phantom-logo.svg" alt=""> Phantom</a>
    <span class="min-spacer"></span>
    <a class="btn btn-quiet btn-sm" id="backToPlans" href="plans.html">Back to plans</a>
  </div>
</header>

<main class="stage">
  <div class="checkout-card">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <img class="mark-img" src="assets/phantom-logo.svg" alt="" style="display:none" id="markImg">
    <h1 id="title">Taking you to secure checkout…</h1>
    <p class="sub" id="detail">Payments are handled by Stripe.</p>

    <!-- Operator card: shown instead of the auto-redirect when an admin session
         exists. Override = markIntakePaid(admin_override) — skips Stripe entirely. -->
    <div id="operatorCard" style="display:none; margin-top:22px">
      <div class="op-divider"><span class="rule"></span>operator<span class="rule"></span></div>
      <button class="btn btn-primary btn-block" id="overrideBtn" style="height:50px">Override — mark paid &amp; continue</button>
      <button class="btn btn-block" id="realPayBtn" style="height:46px; margin-top:10px">Proceed to real checkout</button>
      <p class="note">
        Override unlocks the pipeline exactly like a paid customer (via admin_override) — no Stripe involved.
      </p>
      <div id="opMsg"></div>
    </div>
  </div>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const intakeId = params.get('intake');
  const plan = params.get('plan');
  if (!intakeId) location.replace('index.html');

  // Cosmetic-only: point the header's "back" link at the same intake context.
  const backLink = document.getElementById('backToPlans');
  if (backLink) backLink.href = 'plans.html' + (intakeId ? '?intake=' + encodeURIComponent(intakeId) : '');

  const successUrl = 'checkout-success.html?intake=' + encodeURIComponent(intakeId);

  async function realCheckout() {
    try {
      const r = await fetch('/api/intake/' + encodeURIComponent(intakeId) + '/checkout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify(plan ? { plan } : {}),
      });
      const d = await r.json();
      if (r.status === 401 && d.need_auth) {
        location.replace('signup.html?intake=' + encodeURIComponent(intakeId) + (plan ? '&plan=' + encodeURIComponent(plan) : ''));
        return;
      }
      if (!d.success) throw new Error(d.error || 'checkout failed');
      location.replace(d.url);
    } catch (err) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Checkout hit a snag';
      document.getElementById('detail').textContent = err.message + ' — go back to plans and try again.';
      track('checkout.error', { error: String(err.message).slice(0, 120) });
    }
  }

  async function operatorOverride() {
    const btn = document.getElementById('overrideBtn');
    const msg = document.getElementById('opMsg');
    btn.disabled = true; msg.textContent = 'marking paid…';
    try {
      const r = await fetch('/api/admin/intake/' + encodeURIComponent(intakeId) + '/override', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ plan: plan || 'standard' }),
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || 'override failed');
      track('checkout.operator_override', { plan: plan || 'standard' });
      location.replace(successUrl);
    } catch (err) {
      msg.style.color = 'var(--danger, #ff5470)';
      msg.textContent = err.message;
      btn.disabled = false;
    }
  }

  (async () => {
    let isAdmin = false;
    try {
      const cfg = await (await fetch('/api/config', { credentials: 'same-origin' })).json();
      isAdmin = !!(cfg && cfg.is_admin);
    } catch { /* treat as customer */ }

    if (!isAdmin) { realCheckout(); return; }

    // Operator: pause the auto-redirect and offer the choice.
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('markImg').style.display = 'block';
    document.getElementById('title').textContent = 'Operator checkout';
    document.getElementById('detail').textContent = (plan || 'selected') + ' plan · intake ' + intakeId;
    document.getElementById('operatorCard').style.display = 'block';
    document.getElementById('overrideBtn').addEventListener('click', operatorOverride);
    document.getElementById('realPayBtn').addEventListener('click', () => {
      document.getElementById('realPayBtn').disabled = true;
      realCheckout();
    });
  })();
</script>

</body>
</html>
