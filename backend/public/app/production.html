<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production · Phantom 2.0</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/phantom-logo.svg">
<link rel="stylesheet" href="assets/phantom.css">
<style>
  .stage { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 16px; }
  .panel h2 { font-size: 1rem; margin: 0 0 12px; }
  .phantom-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .phantom-card { border: 1px solid var(--hairline); border-radius: 12px; padding: 12px; font-size: .8rem; }
  .phantom-card b { color: #fff; }
  .phantom-card .dim { font-size: .72rem; }
  .camp { border-bottom: 1px solid var(--hairline); padding: 10px 0; }
  .camp .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: .66rem; padding: 2px 8px; border: 1px solid var(--hairline); border-radius: 999px; color: var(--text-3); }
  .tag.product { color: #36e2c4; border-color: rgba(54,226,196,.4); }
  .tag.fifa, .tag.world_event, .tag.weather, .tag.business_event { color: #ffb454; border-color: rgba(255,180,84,.4); }
  .cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
  .day { border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 8px; font-size: .68rem; font-family: var(--mono); color: var(--text-2); }
  .day b { color: #fff; display: block; font-size: .7rem; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--hairline); }
  th { color: var(--text-3); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
  details.brief { font-size: .74rem; color: var(--text-2); }
  details.brief pre { white-space: pre-wrap; background: rgba(255,255,255,.03); border-radius: 8px; padding: 8px; max-height: 220px; overflow: auto; }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="admin.html"><img class="mark" src="assets/phantom-logo.svg" alt=""> Phantom <small>production</small></a>
    <a class="btn" href="admin.html" style="height:36px">← Console</a>
  </div>
</header>

<main class="stage">
  <div class="card card-pad panel">
    <h2 id="head">loading…</h2>
    <div id="sub" class="dim" style="font-size:.8rem"></div>
    <div style="display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap">
      <button class="btn btn-primary" id="genBtn" style="height:40px">Generate media</button>
      <span id="estimate" class="dim mono" style="font-size:.74rem">estimating…</span>
    </div>
    <div id="genMsg" class="dim" style="font-size:.78rem; margin-top:6px"></div>
  </div>
  <div class="card card-pad panel"><h2>Phantoms <span class="dim" style="font-weight:400; font-size:.75rem">the 6 UGC creators</span></h2><div class="phantom-grid" id="phantoms"></div></div>
  <div class="card card-pad panel"><h2>Campaigns</h2><div id="campaigns"></div></div>
  <div class="card card-pad panel"><h2>Coverage <span id="covBadge"></span></h2><div id="coverage" class="dim" style="font-size:.8rem">loading…</div></div>
  <div class="card card-pad panel"><h2>Deployment calendar</h2><div class="cal" id="calendar"></div></div>
  <div class="card card-pad panel"><h2>Pieces</h2><div style="overflow-x:auto" id="pieces"></div></div>
</main>

<script>
const intakeId = new URLSearchParams(location.search).get('intake');
if (!intakeId) location.replace('admin.html');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadEstimate() {
  const r = await fetch('/api/admin/intake/' + encodeURIComponent(intakeId) + '/media-estimate', { credentials: 'same-origin' });
  const d = await r.json();
  if (!d.success) return;
  const e = d.estimate;
  document.getElementById('estimate').textContent =
    (e.mock_mode ? '[MOCK — $0] ' : '') + e.phantoms + ' faces + ' + e.video_shots + ' shots ('
    + e.reused_shots + ' reused) + ' + e.posts + ' post images ≈ $' + e.est_usd.toFixed(2);
  document.getElementById('genBtn').textContent = e.mock_mode ? 'Generate media (mock)' : 'Generate media ($' + e.est_usd.toFixed(2) + ')';
}

document.getElementById('genBtn').addEventListener('click', async () => {
  const btn = document.getElementById('genBtn');
  if (!confirm('Kick media generation for everything pending on this intake?')) return;
  btn.disabled = true;
  const r = await fetch('/api/admin/intake/' + encodeURIComponent(intakeId) + '/generate-media', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: '{}',
  });
  const d = await r.json();
  document.getElementById('genMsg').textContent = d.success
    ? 'kicked: ' + d.kicked.phantoms + ' phantoms, ' + d.kicked.reels + ' reels, ' + d.kicked.posts + ' posts — refreshing…'
    : 'error: ' + d.error;
  btn.disabled = false;
  setTimeout(render, 1500);
  setInterval(render, 8000);
});

async function render() {
  const r = await fetch('/api/admin/intake/' + encodeURIComponent(intakeId) + '/production', { credentials: 'same-origin' });
  if (r.status === 401) { location.href = '/app/admin-login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
  const d = await r.json();
  if (!d.success) { document.getElementById('head').textContent = d.error; return; }

  const counts = Object.fromEntries(d.counts.map((c) => [c.kind, c.n]));
  document.getElementById('head').textContent = d.intake.business_name + ' — production';
  document.getElementById('sub').textContent = d.intake.tenant_slug + ' · ' + (d.intake.plan || 'no plan') + ' · ' + d.intake.payment_status
    + ' · ' + (counts.reel || 0) + ' reels / ' + (counts.post || 0) + ' posts across ' + d.campaigns.length + ' campaigns';

  document.getElementById('phantoms').innerHTML = d.phantoms.map((p) =>
    '<div class="phantom-card">'
    + (p.asset_id ? '<img src="/api/admin/media/' + p.asset_id + '/url" alt="" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; margin-bottom:6px; background:rgba(255,255,255,.04)">' : '')
    + '<b>' + esc(p.name) + '</b> <span class="dim">' + (p.age || '') + '</span>'
    + ' <span class="tag" style="font-size:.6rem">' + esc(p.status) + '</span>'
    + '<div class="dim">' + esc(p.persona || '') + '</div>'
    + '<div class="dim" style="margin-top:4px">' + esc(p.vibe || '') + '</div>'
    + '<div class="dim" style="margin-top:4px; opacity:.7">' + esc((p.appearance_prompt || '').slice(0, 90)) + '…</div></div>').join('')
    || '<span class="dim">none yet</span>';

  document.getElementById('campaigns').innerHTML = d.campaigns.map((c) => {
    const n = d.pieces.filter((p) => p.campaign_id === c.id);
    return '<div class="camp"><div class="t"><b style="color:#fff">' + esc(c.title) + '</b>'
      + '<span class="tag ' + esc(c.type) + '">' + esc(c.type) + '</span>'
      + (c.moment ? '<span class="tag">' + esc(c.moment) + '</span>' : '')
      + '<span class="dim" style="font-size:.72rem">' + n.filter((p) => p.kind === 'reel').length + 'r / ' + n.filter((p) => p.kind === 'post').length + 'p</span></div>'
      + '<div class="dim" style="font-size:.78rem; margin-top:3px">' + esc(c.concept) + '</div>'
      + '<div class="dim" style="font-size:.72rem; margin-top:2px; opacity:.75">visual: ' + esc(c.visual_design) + '</div></div>';
  }).join('') || '<span class="dim">none yet</span>';

  document.getElementById('calendar').innerHTML = d.calendar.map((c) =>
    '<div class="day"><b>' + esc(c.date.slice(5)) + '</b>' + c.reels + ' reel · ' + c.posts + ' post</div>').join('')
    || '<span class="dim">no schedule yet</span>';

  const phMap = Object.fromEntries(d.phantoms.map((p) => [p.id, p.name]));
  const cMap = Object.fromEntries(d.campaigns.map((c) => [c.id, c.title]));
  document.getElementById('pieces').innerHTML = '<table><thead><tr><th>date</th><th>kind</th><th>pillar</th><th>campaign</th><th>phantom</th><th>status</th><th>media</th><th>QC</th><th>brief</th></tr></thead><tbody>'
    + d.pieces.map((p) => {
      const qc = p.status === 'ready'
        ? '<button class="btn" style="height:24px; font-size:.66rem; padding:0 8px" onclick="qcPiece(' + p.id + ',\'approve\')">✓</button> '
          + '<button class="btn" style="height:24px; font-size:.66rem; padding:0 8px" onclick="qcPiece(' + p.id + ',\'reject\')">✗</button>'
        : (p.regen_count ? '<span class="dim" style="font-size:.68rem">regen ' + p.regen_count + '/3</span>' : '—');
      return '<tr><td>' + esc(p.scheduled_date) + '</td><td>' + p.kind + '</td><td>' + esc(p.pillar || '—')
      + '</td><td>' + esc(cMap[p.campaign_id] || p.campaign_id) + '</td><td>' + esc(phMap[p.phantom_id] || '—')
      + '</td><td>' + esc(p.status) + '</td><td>'
      + (p.assets || []).map((a) => '<a href="/api/admin/media/' + a.id + '/url" target="_blank">' + a.kind + (a.slot != null ? a.slot : '') + '</a>').join(' · ')
      + '</td><td>' + qc + '</td><td><details class="brief"><summary>view</summary><pre>'
      + esc(JSON.stringify(p.brief, null, 1)) + '</pre></details></td></tr>';
    }).join('')
    + '</tbody></table>';

  const cov = await fetch('/api/admin/intake/' + encodeURIComponent(intakeId) + '/coverage', { credentials: 'same-origin' }).then((r) => r.json());
  if (cov.success) {
    const rep = cov.report;
    document.getElementById('covBadge').innerHTML = rep.green
      ? '<span class="tag" style="color:#36e2c4; border-color:rgba(54,226,196,.5)">GREEN</span>'
      : '<span class="tag" style="color:#ffb454; border-color:rgba(255,180,84,.5)">ATTENTION</span>';
    document.getElementById('coverage').innerHTML =
      'counts: ' + rep.counts.reels + 'r/' + rep.counts.posts + 'p'
      + (rep.counts.plan_target ? ' (plan ' + rep.counts.plan_target.reels + '/' + rep.counts.plan_target.posts + (rep.counts.custom_build ? ' — custom build' : '') + ')' : '')
      + ' · phantoms used ' + rep.phantoms.used + '/' + rep.phantoms.cast
      + ' · QC reviewed ' + rep.qc.reviewed + ', pending ' + rep.qc.pending_review
      + '<br>pillars: ' + rep.pillars.map((p) => p.pillar + ' ' + p.actual_pct + '%/' + p.target_pct + '%' + (p.ok ? '' : ' ⚠')).join(' · ')
      + '<br>campaign types: ' + Object.entries(rep.campaign_types).map(([t, n]) => t + '×' + n).join(' · ');
  }
}

window.qcPiece = async (id, verdict) => {
  let reason_text = null, reason_tags = null;
  if (verdict === 'reject') {
    reason_text = prompt('Why? (this trains the next batch — be specific)');
    if (reason_text === null) return;
    const tags = prompt('Tags (comma-sep): face_quality, caption, brand_tone, off_pillar, product, motion, audio', '');
    reason_tags = (tags || '').split(',').map((s) => s.trim()).filter(Boolean);
  }
  const r = await fetch('/api/admin/piece/' + id + '/qc', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify({ verdict, reason_text, reason_tags }),
  }).then((x) => x.json());
  if (!r.success) alert(r.error);
  render();
};
render();
loadEstimate();
</script>

</body>
</html>
